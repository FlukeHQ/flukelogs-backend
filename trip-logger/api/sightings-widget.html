<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recent Sightings – Enocean Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Embedded or standalone, decided before first paint so the styles below
  // never flash the wrong way. Embedded, the HOST page scrolls and the
  // iframe is auto-sized to our content, so our own scrollbar is a dead
  // control: it renders a track next to the widget that cannot scroll.
  try { if (window.parent !== window) document.documentElement.classList.add('is-embedded'); } catch (e) {
    // Cross-origin access threw, which itself means we are framed.
    document.documentElement.classList.add('is-embedded');
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Match the operator app — same ink palette so embed feels native */
    --ink:    #0a0c0e;
    --ink-2:  #0f1316;
    --ink-3:  #161b1f;
    --ink-4:  #1d2429;
    --hair:   rgba(255,255,255,0.08);
    --hair-2: rgba(255,255,255,0.14);
    --text:       #f4f6f7;
    --text-dim:   rgba(244,246,247,0.62);
    --text-faint: rgba(244,246,247,0.42);
    --teal:   #6fb1ac;
    --gold:   #c8a86b;
    --accent: #e6f0f0;
    /* Backward-compat aliases for unchanged JS */
    --bg: var(--ink);
    --surface: var(--ink-3);
    --border: var(--hair);
    --muted: var(--text-dim);
    --tag-bg: var(--ink-4);
  }
  html, body {
    background:
      radial-gradient(120% 60% at 50% 110%, rgba(64,108,118,.35) 0%, rgba(20,32,38,.35) 35%, transparent 70%),
      radial-gradient(80% 50% at 50% -10%, rgba(80,118,128,.12) 0%, transparent 60%),
      linear-gradient(180deg, #06090b 0%, #0a0e11 40%, #0d1418 70%, #0a1014 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* Embedded: no scrollbar of our own, and no 100vh floor. The floor would
     pad a short widget (a new operator's first trip) out to a full screen of
     empty gradient inside the host's page. Scrolling stays *possible* rather
     than hidden behind overflow:hidden, so a mis-sized iframe can never trap
     content out of reach; only the visible bar goes away. */
  .is-embedded, .is-embedded body {
    min-height: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .is-embedded body::-webkit-scrollbar,
  .is-embedded::-webkit-scrollbar { width: 0; height: 0; display: none; }

  .widget-wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 40px; }

  /* ── Editorial header (Fraunces title + monospace date) ── */
  .ed-header { margin-bottom: 22px; }
  .ed-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 38px;
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: var(--text);
    margin: 0;
  }
  .ed-date {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
    letter-spacing: 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ed-date-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 500;
  }

  /* ── What's out there now banner ── */
  .now-banner {
    background:
      radial-gradient(120% 100% at 0% 100%, rgba(111,177,172,.12) 0%, rgba(111,177,172,0) 60%),
      var(--ink-3);
    border: 1px solid rgba(111,177,172,.28);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 14px 28px rgba(0,0,0,.35);
  }
  .now-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 12px var(--teal); animation: nowPulse 2.4s ease-in-out infinite; flex-shrink: 0; }
  @keyframes nowPulse { 0%,100%{ opacity: 1; transform: scale(1); } 50%{ opacity: .55; transform: scale(.85); } }
  .now-content { flex: 1; }
  .now-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.26em; color: var(--teal); margin-bottom: 4px; }
  .now-species { font: 600 14px/1.4 "Open Sans", sans-serif; color: var(--text); }
  .now-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.02em; }
  .now-cta {
    background: linear-gradient(180deg, #fff 0%, #e8edee 100%);
    color: #0a0c0e;
    border: 0;
    border-radius: 999px;
    padding: 10px 18px;
    font: 700 10px/1 "Open Sans", sans-serif;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 14px 28px rgba(0,0,0,.45);
    transition: transform .15s ease;
  }
  .now-cta:hover { transform: translateY(-1px); }

  /* ── Live variant of the banner — trip in progress right now ────── */
  .now-banner.is-live {
    background:
      radial-gradient(120% 100% at 0% 100%, rgba(255,107,107,.14) 0%, rgba(255,107,107,0) 60%),
      var(--ink-3);
    border-color: rgba(255,107,107,.38);
  }
  .now-banner.is-live .now-dot { background: #ff6b6b; box-shadow: 0 0 12px #ff6b6b; animation-duration: 1.4s; }
  .now-banner.is-live .now-label { color: #ff6b6b; }

  /* Delayed boat position on the map. The same hull the replay boat uses,
     so a live boat and a played-back one are recognisably the same object
     and not two different ideas of "boat" on one map. It used to be a plain
     coloured dot, which read as one more sighting. */
  .live-boat { position: relative; }
  .live-boat .hull {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    line-height: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45));
  }
  /* The ring still pulses: that is what says "now" rather than "earlier". */
  .live-boat .ping {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid #ff6b6b;
    animation: livePing 1.8s ease-out infinite;
  }
  @keyframes livePing { 0%{ transform: scale(.5); opacity: .9; } 100%{ transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .live-boat .ping { animation: none; opacity: .5; } }

  /* ── Filter + Map grid (D on desktop, C on mobile) ─────────────── */
  .fm-grid {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 22px;
    align-items: start;
    margin-bottom: 24px;
    min-width: 0;
  }
  /* min-width:0 on grid children prevents the species rail's horizontal
     overflow (or any wide pin label) from blowing out the grid track
     wider than the viewport. */
  .fm-grid > * { min-width: 0; }
  .fm-grid .map-wrap { margin-bottom: 0; }
  /* When the operator has show_map_on_widget = false, the .map-wrap is
     removed from the DOM. Collapse the grid to a single column so the
     legend doesn't sit next to an empty slot. */
  .fm-grid.no-map { grid-template-columns: 1fr; }
  .fm-grid.no-map .legend-col { max-width: 480px; }

  /* Likelihood bar behind each species row: the row IS the statistic. */
  .legend-row { position: relative; }
  .legend-bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    opacity: .13; border-radius: 0 4px 4px 0;
    pointer-events: none;
  }
  .legend-freq {
    font-size: 11px; color: var(--text-faint);
    letter-spacing: .04em; margin-left: auto; padding-right: 10px;
    white-space: nowrap;
  }

  /* ── Legend column (desktop / D) ────────────────────────────────── */
  .legend-head {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 500;
    padding-bottom: 6px;
  }
  .legend-list { border-top: 1px solid var(--hair); }
  .legend-row {
    position: relative;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--hair);
    color: var(--text-dim);
    padding: 10px 12px 10px 14px;
    font-family: "Open Sans", sans-serif;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .legend-row:hover { background: rgba(255,255,255,.025); }
  .legend-row.is-active { color: var(--text); font-weight: 500; letter-spacing: 0; }
  .legend-row.is-dimmed { color: var(--text-faint); }
  .legend-row::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: transparent;
    transition: background .15s;
  }
  .legend-row.is-active::before { background: var(--text); }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4);
    flex-shrink: 0;
    display: inline-block;
    box-sizing: border-box;
  }
  .legend-dot.is-split { background: linear-gradient(90deg, #ffffff 50%, #000000 50%); }
  .legend-dot.is-all { background: transparent; border: 1px dashed var(--text-faint); }
  .legend-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .legend-row.is-active .legend-count { color: var(--text-dim); }
  .legend-status {
    margin-top: 12px;
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.45;
  }

  /* ── Mobile filter (segmented + rail / C) — hidden on desktop ─── */
  .filter-mobile { display: none; min-width: 0; }
  .seg-group {
    display: flex;
    border: 1px solid var(--hair);
    border-radius: 4px;
    overflow: hidden;
    width: 100%;
  }
  .seg-btn {
    flex: 1 1 0;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 4px;
    font-family: "Open Sans", sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--hair); }
  .seg-btn.is-active { background: var(--ink-4); color: var(--text); }
  .seg-btn-count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    color: var(--text-faint);
  }
  .seg-btn.is-active .seg-btn-count { color: var(--text-dim); }

  .rail-wrap { position: relative; margin-top: 10px; min-width: 0; }
  .species-rail {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }
  .species-rail::-webkit-scrollbar { display: none; }
  .rail-fade {
    position: absolute;
    right: 0; top: 0; bottom: 4px;
    width: 28px;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--ink));
  }
  .rail-pill {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--hair);
    color: var(--text-dim);
    padding: 5px 11px;
    border-radius: 999px;
    font-family: "Open Sans", sans-serif;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
    scroll-snap-align: start;
    -webkit-tap-highlight-color: transparent;
  }
  .rail-pill.is-active { background: var(--ink-4); border-color: var(--hair-2); color: var(--text); }
  .rail-pill .legend-dot { width: 6px; height: 6px; }
  .rail-pill-count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px;
    color: var(--text-faint);
  }

  /* ── Responsive: < 720px → swap to mobile pattern ─────────────── */
  @media (max-width: 720px) {
    .widget-wrap { padding: 20px 14px 32px; }
    .fm-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .legend-col { display: none; }
    .filter-mobile { display: block; }
    .ed-title { font-size: 30px; }
    .trip-body { flex-direction: column; padding: 6px 12px 12px; }
    .trip-gallery { flex: none; width: 100%; }
    .gv-inline { margin: 0 12px 12px; }
  }

  .map-wrap {
    border: 1px solid var(--hair);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 24px;
    height: 380px;
    position: relative;
    box-shadow: 0 14px 28px rgba(0,0,0,.35);
  }
  #sightings-map { width: 100%; height: 100%; background: #0a1628; }
  .leaflet-tile { filter: brightness(0.92) contrast(1.05); }
  .leaflet-container { background: #0a1628 !important; font-family: "Open Sans", sans-serif !important; }
  .leaflet-popup-content-wrapper { background: var(--ink-3); color: var(--text); border: 1px solid var(--hair-2); border-radius: 10px; box-shadow: 0 14px 28px rgba(0,0,0,.5); }
  .leaflet-popup-tip { background: var(--ink-3); }
  .leaflet-popup-close-button { color: var(--text-dim) !important; }

  .map-hint {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,0.65);
    color: var(--text-dim);
    font-size: 9px;
    padding: 5px 10px;
    border-radius: 999px;
    z-index: 1000;
    pointer-events: none;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ── Full-screen map mode (office TV / kiosk) ───────────────────── */
  .map-full-btn {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.65); color: #fff;
    border: 1px solid rgba(255,255,255,.18);
    cursor: pointer; transition: background .15s ease;
  }
  .map-full-btn:hover { background: rgba(0,0,0,0.85); }
  .map-full-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .map-wrap.is-full {
    position: fixed; inset: 0; z-index: 99999;
    height: auto; margin: 0; border: none; border-radius: 0;
  }
  /* Live status overlaid on the full-screen map. Sized up for across-the-
     room reading — this mode exists for a TV on an office wall. */
  .live-overlay {
    position: absolute; top: 20px; left: 20px; z-index: 1000;
    display: none; align-items: center; gap: 16px;
    background: rgba(10,12,14,0.82);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,107,107,.38); border-radius: 16px;
    padding: 18px 26px; max-width: min(82vw, 640px);
    box-shadow: 0 14px 28px rgba(0,0,0,.45);
  }
  .live-overlay.on { display: flex; }
  .live-overlay .now-dot { background: #ff6b6b; box-shadow: 0 0 12px #ff6b6b; animation-duration: 1.4s; width: 10px; height: 10px; }
  .live-overlay .now-label { color: #ff6b6b; font-size: clamp(9px, 1.1vw, 12px); }
  .live-overlay .now-species { font-size: clamp(15px, 2.2vw, 26px); }
  .live-overlay .now-meta { font-size: clamp(10px, 1.3vw, 14px); }

  .feed-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .feed-header h3 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.28em; color: var(--text-dim); }
  .feed-count { font-size: 10px; color: var(--text-faint); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }

  .trip-card {
    background: var(--ink-3);
    border: 1px solid var(--hair);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color .15s, transform .15s;
    box-shadow: 0 8px 18px rgba(0,0,0,.25);
  }
  .trip-card.selected { border-color: var(--hair-2); }
  .trip-date-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    transition: background .1s;
  }
  .trip-date-header:hover { background: rgba(255,255,255,0.025); }
  .trip-date-header.active-trip { background: rgba(255,255,255,0.04); }
  .trip-date-label { font: 600 13px/1 "Open Sans", sans-serif; color: var(--text); display: flex; align-items: center; gap: 8px; letter-spacing: 0.005em; }
  .active-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); display: none; }
  .trip-date-header.active-trip .active-indicator { display: inline-block; }
  .trip-date-right { display: flex; align-items: center; gap: 12px; }
  .trip-summary { font-size: 10px; color: var(--text-faint); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }
  .trip-share-btn,
  .trip-replay-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--hair);
    color: var(--text-dim);
    width: 30px; height: 30px;
    border-radius: 50%;
    padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .trip-share-btn:hover,
  .trip-replay-btn:hover { color: var(--text); border-color: var(--hair-2); background: rgba(255,255,255,.05); }
  .trip-share-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .trip-replay-btn svg { width: 11px; height: 11px; fill: currentColor; }

  /* Toast for the desktop-Firefox clipboard fallback (and any future
     non-Share-API browser). Fades in/out via the .show class. */
  .share-toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--ink-3);
    border: 1px solid var(--hair-2);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font: 500 12px/1 "Open Sans", sans-serif;
    letter-spacing: 0.04em;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 9999;
  }
  .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .trip-sightings { padding: 4px 0; }

  .sighting-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--hair);
    cursor: pointer;
    transition: background .1s;
  }
  .sighting-row:last-child { border-bottom: none; }
  .sighting-row:hover { background: rgba(255,255,255,0.025); }
  .sighting-row.active { background: rgba(255,255,255,0.04); border-left: 2px solid var(--teal); padding-left: 14px; }
  .sighting-row .species-icon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
  .sighting-row .species-name { flex: 1; font: 500 13px/1.3 "Open Sans", sans-serif; color: var(--text); letter-spacing: 0.005em; }
  .sighting-row .species-count { font: 600 12px/1 "Open Sans", sans-serif; color: var(--text); letter-spacing: 0.04em; }
  .trip-card.hidden { display: none; }

  /* ── Captain audio player — custom waveform ───────────────── */
  .trip-audio {
    padding: 12px 16px 14px;
    border-bottom: 1px solid var(--hair);
    background: linear-gradient(180deg, rgba(111,177,172,.04) 0%, transparent 100%);
  }
  .audio-meta {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.26em;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .audio-meta .audio-meta-icon { color: var(--teal); font-size: 11px; }
  .audio-player {
    display: flex; align-items: center; gap: 10px;
    background: var(--ink-4);
    border: 1px solid var(--hair);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
  }
  .audio-play {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 0;
    background: linear-gradient(180deg, #fff 0%, #e8edee 100%);
    color: #0a0c0e;
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 14px rgba(0,0,0,.4);
    transition: transform .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-play:hover { transform: scale(1.05); }
  .audio-play:active { transform: scale(0.96); }
  .audio-play svg { width: 12px; height: 12px; fill: currentColor; }
  .audio-waveform {

  }
} else {
  const wrap = document.querySelector('.map-wrap');
  if (wrap) wrap.remove();
  // Collapse the legend+map grid to a single column so the legend doesn't
  // sit next to an empty slot where the map used to be.
  document.querySelector('.fm-grid')?.classList.add('no-map');
}

// Custom split circle marker for Orca (black/white)
function createOrcaIcon(lat, lng) {
  const size = 16;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${size/2 - 1}" fill="white" stroke="#000" stroke-width="1.5"/>
    <path d="M${size/2},1 A${size/2-1},${size/2-1} 0 0,1 ${size/2},${size-1} Z" fill="black"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -size/2],
  });
}

function refreshMarkers() {
  if (!map) return;
  markers.forEach(m => map.removeLayer(m));
  markers.length = 0;

  // While a trip is broadcasting, the map opens clean — just the live boat
  // and its live sighting dots. Old pins next to the live layer read as two
  // boats out at once. A visitor who deliberately picks a past trip or a
  // species still gets those pins.
  if (liveHidePins && !activeTripKey && !activeFilter) {
    const hint = document.getElementById('map-hint');
    if (hint) hint.textContent = 'Live trip in progress — click a past trip to see its pins';
    return;
  }

  // Trip-date and species selection both hard-filter the pins — when a
  // species is active every other species disappears so the picked one
  // stands alone (the older dimmed-out version looked muddy on the light
  // basemap, especially for the pale dolphin colors).
  const dataToShow = activeTripKey
    ? allData.filter(s => s.trip_id === activeTripKey)
    : allData;

  dataToShow.forEach(s => {
    if (!s.lat || !s.lng) return;
    if (activeFilter && s.species !== activeFilter) return;
    const meta = sm(s.species);
    let m;

    if (meta.isSplit) {
      m = L.marker([+s.lat, +s.lng], { icon: createOrcaIcon(), opacity: 1 });
    } else {
      m = L.circleMarker([+s.lat, +s.lng], {
        radius: activeFilter ? 8.5 : 7,
        fillColor: meta.color,
        color: meta.borderColor || '#000',
        weight: activeFilter ? 2 : 1.5,
        fillOpacity: 0.95,
        opacity: 1,
      });
    }

    const depthLabel = fmtDepth(s.depth_meters);
    const depthLine = depthLabel ? `Depth: <strong>${depthLabel}</strong><br>` : '';
    // Where it was, in plotter format. Only on finished trips: the live
    // layer's positions are deliberately delayed and snapped to a coarse
    // grid, so printing coordinates there would imply a precision that
    // isn't real and hand out a waypoint to steer to.
    const coordLine = fmtLatLng(s.lat, s.lng);
    m.bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;line-height:1.6;">
      <strong style="font-size:13px;">${meta.icon} ${s.species || 'Unknown'}</strong><br>
      Count: <strong>${s.count ?? '—'}</strong><br>
      ${depthLine}${fmtDate(s.trip_date)}${coordLine ? `<br><span style="white-space:nowrap;">${coordLine}</span>` : ''}
    </div>`);
    m._tripKey = s.trip_id;
    m._species = s.species;
    m.addTo(map);
    markers.push(m);
  });

  // The boat's real path is intentionally NOT drawn here. Selecting a trip
  // shows only its pins; the track line is revealed progressively by the ▶
  // replay as the boat follows it (see replayTrip / _replayLine), so it
  // "draws itself" rather than appearing all at once ahead of the boat.

  // Update hint
  const hint = document.getElementById('map-hint');
  if (activeTripKey) {
    const sel = allData.find(s => s.trip_id === activeTripKey) || {};
    hint.textContent = `Showing ${fmtDateShort(sel.trip_date)}${sel.trip_part ? ' ' + sel.trip_part.toLowerCase() : ''} — click map to deselect`;
  } else if (activeFilter) {
    hint.textContent = `Highlighting: ${activeFilter}`;
  } else {
    hint.textContent = 'Click a trip to see its pins';
  }
}

// Click map background to deselect trip (only registered when the map exists)
if (map) {
  map.on('click', () => {
    if (activeTripKey) {
      activeTripKey = null;
      refreshMarkers();
      document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
      document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('selected', 'hidden'));
    }
  });
}

// ── Data ─────────────────────────────────────────────────────────────────────
// Sightings + captain audio come from /api/widget-data (service role, scoped
// to this operator by slug). The widget no longer reads the sightings /
// trip_audio tables directly with the anon key — that scoping was client-side
// only. Now one operator can't read another's rows, and the
// show_map_on_widget opt-out is enforced server-side (lat/lng omitted there).
// Both feeds arrive in one response; memoize so the two callers share it.
let _widgetDataPromise = null;
function loadWidgetData() {
  if (_widgetDataPromise) return _widgetDataPromise;
  const op = OP.slug ? encodeURIComponent(OP.slug) : '';
  _widgetDataPromise = fetch(`/api/widget-data?op=${op}`, { headers: { 'Accept': 'application/json' } })
    .then(res => { if (!res.ok) throw new Error(`widget-data ${res.status}`); return res.json(); })
    .catch(() => ({ sightings: [], audio: [] }));
  return _widgetDataPromise;
}

async function fetchSightings() {
  const data = await loadWidgetData();
  return Array.isArray(data.sightings) ? data.sightings : [];
}

// Backwards paging: the feed opens on the newest ~100 sightings and this
// walks further into the season one page at a time. Older pages come
// without breadcrumb tracks (pin-to-pin lines are fine for history) and
// everything else merges into the same maps the first load filled.
let feedNextBefore = null;
let feedLoadingMore = false;

function setFeedMoreVisible(on) {
  const wrap = document.getElementById('feed-more-wrap');
  if (wrap) wrap.style.display = on ? '' : 'none';
}

async function loadEarlierTrips() {
  if (feedLoadingMore || !feedNextBefore) return;
  feedLoadingMore = true;
  const btn = document.getElementById('feed-more-btn');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Loading\u2026'; }
  try {
    const op = OP.slug ? encodeURIComponent(OP.slug) : '';
    const res = await fetch(`/api/widget-data?op=${op}&before=${encodeURIComponent(feedNextBefore)}`,
      { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error(`widget-data ${res.status}`);
    const page = await res.json();
    (page.audio || []).forEach(r => { if (r.trip_id && !tripAudioByTrip.has(r.trip_id)) tripAudioByTrip.set(r.trip_id, r); });
    (page.photos || []).forEach(r => {
      if (!r.trip_id) return;
      if (!tripPhotosByTrip.has(r.trip_id)) tripPhotosByTrip.set(r.trip_id, []);
      tripPhotosByTrip.get(r.trip_id).push(r);
    });
    Object.entries(page.trip_meta || {}).forEach(([id, m]) => { if (!tripMetaByTrip.has(id)) tripMetaByTrip.set(id, m); });
    allData = allData.concat(Array.isArray(page.sightings) ? page.sightings : []);
    feedNextBefore = page.has_more ? page.next_before : null;
    renderLegend(allData);
    renderSegmentedRail(allData);
    refreshMarkers();
    renderFeed(allData);
    if (typeof sendHeight === 'function') sendHeight();
  } catch (e) {
    if (btn) btn.textContent = 'Could not load, tap to retry';
  } finally {
    feedLoadingMore = false;
    if (btn) { btn.disabled = false; if (btn.textContent === 'Loading\u2026') btn.textContent = label; }
    setFeedMoreVisible(!!feedNextBefore);
  }
}

// "09:00" (roster 24h format) -> "9:00 AM" for visitor-facing card titles.
// Empty string when the departure is missing or unparsable, so callers can
// fall back to the daypart label.
function fmtDepartureTime(t) {
  if (!t) return '';
  const parts = String(t).split(':');
  const h = Number(parts[0]);
  if (!Number.isFinite(h) || h < 0 || h > 23) return '';
  const m = Number(parts[1]) || 0;
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
}

// Roster facts per trip from the boat app (boat name, scheduled departure).
// Returns Map(trip_id -> { boat_name, trip_time }); empty for pre-roster
// trips and for feeds served before trip_meta existed.
async function fetchTripMeta() {
  const data = await loadWidgetData();
  const meta = (data.trip_meta && typeof data.trip_meta === 'object') ? data.trip_meta : {};
  return new Map(Object.entries(meta));
}

// Captain audio notes per trip. Returns Map(trip_id -> { audio_url,
// duration_seconds, play_count }) so render code can do a synchronous lookup.
async function fetchTripAudio() {
  const data = await loadWidgetData();
  const rows = Array.isArray(data.audio) ? data.audio : [];
  return new Map(rows.filter(r => r.trip_id).map(r => [r.trip_id, r]));
}

// Continuous GPS breadcrumb per trip (Phase 2). Returns Map(trip_id -> [points]).
// Empty for trips logged before Phase 2 shipped, and empty for any operator
// who has hidden their map (server strips both lat/lng and tracks together).
async function fetchTripTracks() {
  const data = await loadWidgetData();
  const obj = (data && data.tracks) || {};
  const m = new Map();
  for (const id of Object.keys(obj)) {
    if (Array.isArray(obj[id]) && obj[id].length > 1) m.set(id, obj[id]);
  }
  return m;
}

// Gallery photos per trip. Returns Map(trip_id -> [{id, photo_url}]) in order.
async function fetchTripPhotos() {
  const data = await loadWidgetData();
  const rows = Array.isArray(data.photos) ? data.photos : [];
  const m = new Map();
  for (const r of rows) {
    if (!r.trip_id || !r.photo_url) continue;
    if (!m.has(r.trip_id)) m.set(r.trip_id, []);
    m.get(r.trip_id).push(r);
  }
  return m;
}

// Resized variant of a Supabase storage image via the render endpoint, so the
// small hero loads a ~600 to 800px file instead of the full upload. Falls back
// to the original URL if it is not a Supabase object URL.
function thumbUrl(url, w) {
  if (!url || url.indexOf('/object/public/') === -1) return url;
  // resize=contain scales proportionally and keeps the WHOLE photo. The render
  // endpoint crops by default (and with resize=cover) when only a width is
  // given, which is what was slicing the photos.
  return url.replace('/object/public/', '/render/image/public/') +
    '?width=' + w + '&quality=72&resize=contain';
}

// The exact URL the viewer uses: the stored original at full resolution (no
// downscaling). Shared with the hover/touch preloader so the preloaded file is
// a cache hit on click.
function lightboxUrl(url) {
  return url;
}

// ── Trip photo gallery viewer ───────────────────────────────────────────────
// The hero in each card is a swipeable mini carousel. Tapping a photo opens a
// FULL-SCREEN viewer when the embedding page supports it: an auto-height iframe
// cannot position a full-screen overlay on its own, so the page expands the
// iframe to full screen via postMessage (handshake below). When the page does
// not support it (older embed), we fall back to an inline carousel in the card,
// so the feature always works.

let hostFullscreenReady = false;
window.addEventListener('message', e => {
  if (e && e.data && e.data.galleryHostReady) hostFullscreenReady = true;
});
// Ask the host, in case this widget loaded before the host script registered.
try { if (window.parent !== window) window.parent.postMessage({ galleryHostQuery: true }, '*'); } catch (e) {}
function postToHost(msg) { try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {} }

// One slide. `full` = the large viewer image (contain); otherwise a cropped
// hero/carousel image (cover). Tiny blurred variant fills in instantly.
function gallerySlide(p, full) {
  const src  = full ? lightboxUrl(p.photo_url) : thumbUrl(p.photo_url, 900);
  const blur = thumbUrl(p.photo_url, 48).replace('&resize=cover', '');
  const fit  = full ? 'contain' : 'cover';
  return `<img src="${src}" alt="Trip photo" draggable="false"
            style="object-fit:${fit}; background:#11151b url('${blur}') center/cover no-repeat;"
            onload="this.style.backgroundImage='none';${full ? '' : ' sendHeight();'}">`;
}

function buildSwipeTrack(cls, photos, startIdx, onClose, hasCounter) {
  const wrap = document.createElement('div');
  wrap.className = cls;
  const multi = photos.length > 1;
  wrap.innerHTML =
    '<button type="button" class="gv-close" aria-label="Close photos">&times;</button>' +
    (hasCounter && multi ? '<div class="gv-counter"></div>' : '') +
    (multi ? '<button type="button" class="gv-nav gv-prev" aria-label="Previous photo">&#8249;</button>' +
             '<button type="button" class="gv-nav gv-next" aria-label="Next photo">&#8250;</button>' : '') +
    '<div class="gv-track">' + photos.map(p => gallerySlide(p, true)).join('') + '</div>';
  const track = wrap.querySelector('.gv-track');
  const counter = wrap.querySelector('.gv-counter');
  const update = () => { if (counter) { const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); counter.textContent = (i + 1) + ' / ' + photos.length; } };
  track.addEventListener('scroll', update, { passive: true });
  wrap.querySelector('.gv-close').addEventListener('click', (e) => { e.stopPropagation(); onClose(); });
  const prevBtn = wrap.querySelector('.gv-prev'), nextBtn = wrap.querySelector('.gv-next');
  if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }); });
  if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); });
  wrap.addEventListener('click', (e) => { if (e.target.tagName !== 'IMG') onClose(); });
  requestAnimationFrame(() => { track.scrollLeft = (startIdx || 0) * track.clientWidth; update(); });
  return wrap;
}

function closeAllGalleries() {
  const fs = document.querySelector('.gv-fullscreen');
  if (fs) { fs.remove(); postToHost({ galleryFullscreen: false }); }
  document.querySelectorAll('.gv-inline').forEach(c => c.remove());
  sendHeight();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAllGalleries(); return; }
  const t = document.querySelector('.gv-fullscreen .gv-track, .gv-inline .gv-track');
  if (!t) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); t.scrollBy({ left: -t.clientWidth, behavior: 'smooth' }); }
  if (e.key === 'ArrowRight') { e.preventDefault(); t.scrollBy({ left:  t.clientWidth, behavior: 'smooth' }); }
});

function openFullscreenViewer(photos, startIdx) {
  closeAllGalleries();
  postToHost({ galleryFullscreen: true }); // page expands the iframe to full screen
  const ov = buildSwipeTrack('gv-fullscreen', photos, startIdx, closeAllGalleries, true);
  document.body.appendChild(ov);
}

function openInlineViewer(heroEl, photos, startIdx) {
  const card = heroEl.closest('.trip-card');
  if (!card) return;
  if (card.querySelector('.gv-inline')) { closeAllGalleries(); return; } // toggle off
  closeAllGalleries();
  const car = buildSwipeTrack('gv-inline', photos, startIdx, closeAllGalleries, true);
  card.appendChild(car);
  sendHeight();
  car.scrollIntoView({ block: 'nearest' });
}

function openTripViewer(heroEl, key, startIdx) {
  const photos = tripPhotosByTrip.get(key) || [];
  if (!photos.length) return;
  if (hostFullscreenReady) openFullscreenViewer(photos, startIdx);
  else openInlineViewer(heroEl, photos, startIdx);
}

function bindTripGalleries(root) {
  root.querySelectorAll('.trip-gallery').forEach(el => {
    const key = el.getAttribute('data-gallery-trip');
    const heroTrack = el.querySelector('.hero-track');
    // Warm the cache on intent (hover/first touch) so the viewer is ready. Once.
    let warmed = false;
    const warm = () => {
      if (warmed) return; warmed = true;
      (tripPhotosByTrip.get(key) || []).forEach(p => { const im = new Image(); im.src = lightboxUrl(p.photo_url); });
    };
    el.addEventListener('mouseenter', warm);
    el.addEventListener('touchstart', warm, { passive: true });
    const currentIdx = () => heroTrack ? Math.round(heroTrack.scrollLeft / Math.max(1, heroTrack.clientWidth)) : 0;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tapped = e.target.closest('img');
      const idx = (tapped && tapped.dataset.idx != null) ? parseInt(tapped.dataset.idx, 10) : currentIdx();
      openTripViewer(el, key, idx);
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTripViewer(el, key, currentIdx()); } });
  });
}

// ── Custom audio player with decorative waveform ────────────────────────────
// We render 36 vertical bars per player. Heights are PSEUDO-RANDOM but
// derived from a hash of the audio URL, so the same recording always shows
// the same waveform — feels deterministic without doing real audio decoding.
// As the audio plays, bars to the left of the playhead fill teal.
//
// Kept self-contained: one play-pause toggle, one Audio element per player,
// click-to-seek on the waveform, automatic pause-others when a new player
// starts. No dependencies, no library.

const WAVE_BARS = 36;
const SVG_PLAY  = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8L7 20V4z"/></svg>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function fmtAudioTime(sec) {
  const s = Math.max(0, Math.floor(sec || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// Cheap deterministic PRNG seeded from a string. Returns a function that
// yields successive pseudo-random floats in [0, 1).
function seededRng(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => {
    h ^= h << 13; h >>>= 0;
    h ^= h >> 17; h >>>= 0;
    h ^= h << 5;  h >>>= 0;
    return (h >>> 0) / 4294967296;
  };
}

function renderAudioPlayer(audio) {
  const dur = audio.duration_seconds || 0;
  const rng = seededRng(audio.audio_url);
  // Bias toward varied but plausible-looking waveform heights (peaks + valleys)
  const bars = [];
  for (let i = 0; i < WAVE_BARS; i++) {
    // Weighted mix of two random values + an envelope so middle bars trend
    // taller — looks more like real captain narration than uniform noise.
    const env = 0.55 + 0.45 * Math.sin((i / WAVE_BARS) * Math.PI);
    const h = Math.round((rng() * 0.6 + rng() * 0.4) * 60 * env + 22);
    bars.push(`<span class="bar" style="height:${h}%"></span>`);
  }
  const plays = parseInt(audio.play_count, 10) || 0;
  const playsText = plays > 0 ? ' · ' + plays + ' play' + (plays === 1 ? '' : 's') : '';
  return `
    <div class="trip-audio">
      <div class="audio-meta"><span class="audio-meta-icon">●</span>Captain's notes from this trip${dur ? ' · ' + fmtAudioTime(dur) : ''}<span class="audio-plays">${playsText}</span></div>
      <div class="audio-player" data-src="${audio.audio_url}" data-dur="${dur}" data-trip="${audio.trip_id || ''}" data-plays="${plays}">
        <button class="audio-play" type="button" aria-label="Play">${SVG_PLAY}</button>
        <div class="audio-waveform">${bars.join('')}</div>
        <span class="audio-time">${dur ? '0:00 / ' + fmtAudioTime(dur) : '0:00'}</span>
      </div>
    </div>`;
}

// Count one listen the first time a visitor plays a given note this page
// load. Optimistically bumps the visible count, then fires the atomic
// increment RPC — failures are silent, it's a vanity counter.
function recordAudioPlay(player) {
  if (!player || player.dataset.counted) return;
  const tripId = player.dataset.trip;
  if (!tripId) return;
  player.dataset.counted = '1';
  const next = (parseInt(player.dataset.plays, 10) || 0) + 1;
  player.dataset.plays = String(next);
  const wrap = player.closest('.trip-audio');
  const label = wrap && wrap.querySelector('.audio-plays');
  if (label) label.textContent = ' · ' + next + ' play' + (next === 1 ? '' : 's');
  fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_audio_play`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ tid: tripId }),
  }).catch(() => { /* vanity counter — ignore network errors */ });
}

// Wires up every .audio-player on the page. Call after renderFeed paints the
// markup. Idempotent — replays are fine; the dataset.bound flag prevents
// double-binding the same element.
const _audioRegistry = []; // [{ player, audio }] so we can pause-others on play
function bindAudioPlayers(root) {
  root.querySelectorAll('.audio-player').forEach(player => {
    if (player.dataset.bound) return;
    player.dataset.bound = '1';

    const playBtn  = player.querySelector('.audio-play');
    const waveform = player.querySelector('.audio-waveform');
    const timeEl   = player.querySelector('.audio-time');
    const bars     = Array.from(waveform.querySelectorAll('.bar'));
    const src      = player.dataset.src;
    const dur      = parseFloat(player.dataset.dur) || 0;

    const audio = new Audio();
    audio.preload = 'metadata';
    audio.src = src;

    _audioRegistry.push({ player, audio });

    function paint(currentTime, totalTime) {
      const pct = totalTime > 0 ? Math.min(1, currentTime / totalTime) : 0;
      const filled = Math.floor(pct * bars.length);
      bars.forEach((b, i) => b.classList.toggle('played', i < filled));
      timeEl.textContent = totalTime > 0
        ? fmtAudioTime(currentTime) + ' / ' + fmtAudioTime(totalTime)
        : fmtAudioTime(currentTime);
    }
    paint(0, dur || audio.duration || 0);

    audio.addEventListener('timeupdate', () => paint(audio.currentTime, audio.duration || dur));
    audio.addEventListener('loadedmetadata', () => paint(audio.currentTime, audio.duration || dur));
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = SVG_PLAY;
      playBtn.setAttribute('aria-label', 'Play');
      paint(0, audio.duration || dur);
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        // Pause every other player first so two trip audios can't overlap
        _audioRegistry.forEach(({ audio: a, player: p }) => {
          if (a !== audio && !a.paused) {
            a.pause();
            const otherBtn = p.querySelector('.audio-play');
            if (otherBtn) { otherBtn.innerHTML = SVG_PLAY; otherBtn.setAttribute('aria-label', 'Play'); }
          }
        });
        audio.play().then(() => {
          playBtn.innerHTML = SVG_PAUSE;
          playBtn.setAttribute('aria-label', 'Pause');
          recordAudioPlay(player);
        }).catch(() => { /* autoplay block / decode failure — ignore */ });
      } else {
        audio.pause();
        playBtn.innerHTML = SVG_PLAY;
        playBtn.setAttribute('aria-label', 'Play');
      }
    });

    // Click-to-seek on the waveform
    waveform.addEventListener('click', (e) => {
      const rect = waveform.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const total = audio.duration || dur || 0;
      if (total > 0) audio.currentTime = pct * total;
    });
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function fmtDateShort(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function daysBetween(d) {
  const diff = Math.floor((Date.now() - new Date(d + 'T12:00:00')) / 86400000);
  if (diff === 0) return 'today';
  if (diff === 1) return 'yesterday';
  return `${diff} days ago`;
}
// Decimal degrees to the degrees-and-decimal-minutes a chart plotter shows:
// 36.788843, -121.842833 becomes "N 36 47.331  W 121 50.570". Empty string
// when either value is missing, which is also what an operator who hid their
// map gets — widget-data strips lat/lng server side for them.
function fmtLatLng(lat, lng) {
  // Reject the empties BEFORE coercing: +null and +'' are both 0, so an
  // operator who hid their map (lat/lng stripped server side) would get
  // "N 0 0.000  E 0 0.000" on every pin instead of no coordinate line.
  if (lat === null || lat === undefined || lat === '' ||
      lng === null || lng === undefined || lng === '') return '';
  const a = +lat, b = +lng;
  if (!Number.isFinite(a) || !Number.isFinite(b)) return '';
  const dm = (v, pos, neg) => {
    const hemi = v < 0 ? neg : pos;
    const abs = Math.abs(v);
    let deg = Math.floor(abs);
    let min = (abs - deg) * 60;
    // 59.9996 must round up into the next degree, not print as 60.000.
    if (+min.toFixed(3) >= 60) { deg += 1; min = 0; }
    return `${hemi} ${deg} ${min.toFixed(3)}`;
  };
  return `${dm(a, 'N', 'S')}  ${dm(b, 'E', 'W')}`;
}

function fmtDepth(m) {
  if (m == null) return null;
  const v = Number(m);
  if (!Number.isFinite(v) || v <= 0) return null;
  return v < 1000 ? `${Math.round(v)}m` : `${(v / 1000).toFixed(1)}km`;
}

// Group sightings into trips by trip_id (a row with no trip_id — pre-0013
// data — falls back to its date as the key). Returns [tripKey, sightings]
// pairs, newest trip first: by date, then created_at so a day's later
// trip sorts above its earlier one.
function groupByTrip(data) {
  const trips = {};
  data.forEach(s => {
    const key = s.trip_id || (s.trip_date || '').slice(0, 10);
    if (!trips[key]) trips[key] = [];
    trips[key].push(s);
  });
  return Object.entries(trips).sort((a, b) => {
    const da = a[1][0].trip_date || '', db = b[1][0].trip_date || '';
    if (da !== db) return db.localeCompare(da);
    return String(b[1][0].created_at || '').localeCompare(String(a[1][0].created_at || ''));
  });
}

function tallyBySpecies(sightings) {
  const tally = {};
  sightings.forEach(s => {
    if (!tally[s.species]) tally[s.species] = { count: 0, lat: s.lat, lng: s.lng };
    tally[s.species].count += parseInt(s.count) || 1;
    if (s.lat && s.lng) { tally[s.species].lat = s.lat; tally[s.species].lng = s.lng; }
  });
  return Object.entries(tally).sort((a, b) => b[1].count - a[1].count);
}

// ── Now banner ────────────────────────────────────────────────────────────────
function renderNowBanner(data) {
  if (!data.length) return;
  const trips = groupByTrip(data);
  const latestSightings = trips[0][1];
  const latestDate = (latestSightings[0].trip_date || '').slice(0, 10);
  const tallied = tallyBySpecies(latestSightings);
  const speciesNames = tallied.map(([name]) => name);
  const totalAnimals = latestSightings.reduce((sum, s) => sum + (parseInt(s.count) || 1), 0);

  // Format species list nicely
  let speciesText;
  if (speciesNames.length === 1) speciesText = speciesNames[0];
  else if (speciesNames.length === 2) speciesText = speciesNames.join(' & ');
  else speciesText = speciesNames.slice(0, -1).join(', ') + ' & ' + speciesNames.slice(-1);

  document.getElementById('now-species').textContent = speciesText;
  document.getElementById('now-meta').textContent = `${totalAnimals} animals spotted · ${daysBetween(latestDate)}`;
  document.getElementById('now-banner').style.display = 'flex';
}

// ── Live layer ───────────────────────────────────────────────────────────────
// While the operator has a trip broadcasting (data.live from /api/widget-data),
// the recap banner flips into its LIVE variant and the map shows the boat's
// delayed, fuzzed position + path. Everything here is already privacy-
// transformed server-side; the widget just paints what it's given. Polls
// ?live=1 once a minute and reverts cleanly when the broadcast ends.
const LIVE_POLL_MS = 60000;
let liveBoatMarkers = [];

// Only for a boat that matches no roster entry, so there is no QR card colour
// to contradict. Deliberately not the roster palette.
const FALLBACK_BOAT_COLORS = ['#ff6b6b', '#4d7cff', '#e0a13a', '#3aa981'];
let liveTrackLines = [];

// Chaikin corner cutting: each pass replaces every corner with two points a
// quarter of the way along its adjoining segments, which converges on a
// smooth curve through the polyline's shape. Endpoints are preserved so the
// track still starts where the trip did and ends at the boat.
function chaikin(points, iterations) {
  let pts = points;
  for (let it = 0; it < iterations; it++) {
    if (pts.length < 3) return pts;
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ay, ax] = pts[i], [by, bx] = pts[i + 1];
      out.push([ay * 0.75 + by * 0.25, ax * 0.75 + bx * 0.25]);
      out.push([ay * 0.25 + by * 0.75, ax * 0.25 + bx * 0.75]);
    }
    out.push(pts[pts.length - 1]);
    pts = out;
  }
  return pts;
}
let liveSightingMarkers = [];
// While broadcasting, refreshMarkers() suppresses past-trip pins unless the
// visitor explicitly selects a trip or species.
let liveHidePins = false;
// The trip the widget auto-selected at boot (vs one the visitor clicked) —
// only an auto-selection is cleared when a broadcast starts mid-visit.
let autoSelectedTripKey = null;
// One-shot per broadcast: widen the view to include the boat the first time
// it appears (it may be well outside the last trip's pins the map opens on).
// Never re-fires on later polls, so visitors can pan/zoom freely after.
let liveViewFitted = false;

function fmtClock(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function clearLiveMapLayers() {
  liveBoatMarkers.forEach(m => map.removeLayer(m));
  liveBoatMarkers = [];
  liveTrackLines.forEach(l => map.removeLayer(l));
  liveTrackLines = [];
  liveSightingMarkers.forEach(m => map.removeLayer(m));
  liveSightingMarkers = [];
}

// The live block carries one entry per broadcasting boat in `boats`; older
// responses (or a mid-deploy poll) have only the single-boat fields on the
// block itself, which is also exactly what boats[0] mirrors.
function liveBoats(live) {
  if (!live || !live.active) return [];
  return (Array.isArray(live.boats) && live.boats.length) ? live.boats : [live];
}

// Banner + kiosk overlay share one summary of the fleet: what's being
// watched (across every boat) and since when. With one boat out the text is
// identical to what the single-boat widget always said.
//
// A sighting older than the server's watching window no longer claims
// "currently watching," but it doesn't vanish into a bare "searching"
// either — the banner keeps today's best news as "spotted at 1:45 PM"
// until something fresher lands.
function liveStatusText(live) {
  const boats = liveBoats(live);
  const watched = [...new Set(boats.filter(b => b.watching && b.species).map(b => b.species))];
  let species;
  if (watched.length) {
    species = `Currently watching ${watched.join(' & ')}`;
  } else {
    const seen = boats
      .filter(b => b.species && b.species_at)
      .sort((a, b) => Date.parse(b.species_at) - Date.parse(a.species_at))[0];
    const when = seen && fmtClock(seen.species_at);
    species = (seen && when)
      ? `Out searching · ${seen.species} spotted at ${when}`
      : 'Out searching for the next sighting';
  }
  const starts = boats.map(b => Date.parse(b.started_at)).filter(Number.isFinite);
  const since = starts.length ? fmtClock(new Date(Math.min(...starts)).toISOString()) : null;
  let meta = since ? `On the water since ${since}` : '';
  if (boats.length > 1) meta = `${boats.length} boats out${meta ? ' · ' + meta : ''}`;
  return { species, meta };
}

function renderLive(live) {
  const banner = document.getElementById('now-banner');
  const label = banner.querySelector('.now-label');
  lastLive = live && live.active ? live : null;
  updateLiveOverlay();

  if (!live || !live.active) {
    if (banner.classList.contains('is-live')) {
      // Broadcast ended — restore the latest-trip recap (or hide if no data).
      banner.classList.remove('is-live');
      label.textContent = "What's out there right now";
      banner.style.display = 'none';
      renderNowBanner(allData);
    }
    if (map) {
      clearLiveMapLayers();
      if (liveHidePins) { liveHidePins = false; refreshMarkers(); } // pins return
    }
    liveViewFitted = false; // next broadcast gets its own one-shot fit
    return;
  }

  // Going live (at boot or mid-visit): cancel any auto-playing past-trip
  // replay, drop the auto-selected past trip, and clear its pins — the live
  // boat should be alone on the map. One-shot on the transition; anything
  // the visitor picked by hand (trip, species, manual replay) is left alone.
  if (!banner.classList.contains('is-live')) {
    if (typeof stopReplay === 'function') stopReplay();
    if (map) {
      if (activeTripKey && activeTripKey === autoSelectedTripKey) {
        activeTripKey = null;
        document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
        document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('selected', 'hidden'));
      }
      liveHidePins = true;
      refreshMarkers();
    }
  }
  banner.classList.add('is-live');
  label.textContent = 'Live · On the water now';
  const status = liveStatusText(live);
  document.getElementById('now-species').textContent = status.species;
  document.getElementById('now-meta').textContent = status.meta;
  banner.style.display = 'flex';

  if (!map) return;
  clearLiveMapLayers();
  const boats = liveBoats(live);
  // With one boat out everything stays the standard live red. With a fleet,
  // each boat that identified itself renders in its roster color — the same
  // color its QR code prints in — so the lines and markers read apart.
  const multiBoat = boats.length > 1;
  boats.forEach((boat, boatIndex) => {
    // The server resolves boat.color from the roster by id, and now by name
    // too, so it is the same palette slot the boat's QR card prints in. The
    // last-resort palette below only fires for a boat that matches no roster
    // entry at all, where there is no QR colour to contradict, and it exists
    // so two boats out together are never both the same red.
    const color = multiBoat
      ? (boat.color || FALLBACK_BOAT_COLORS[boatIndex % FALLBACK_BOAT_COLORS.length])
      : '#ff6b6b';
    // Live sighting dots — logged mid-trip, published with the same delay +
    // fuzz as the boat. Same species colors as the permanent pins.
    (boat.sightings || []).forEach(s => {
      if (!Number.isFinite(+s.lat) || !Number.isFinite(+s.lng)) return;
      const meta = sm(s.species);
      const m = meta.isSplit
        ? L.marker([+s.lat, +s.lng], { icon: createOrcaIcon(), zIndexOffset: 900 })
        : L.circleMarker([+s.lat, +s.lng], {
            radius: 8, fillColor: meta.color, color: meta.borderColor || '#000',
            weight: 2, fillOpacity: 0.95,
          });
      const when = fmtClock(s.t);
      m.bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;line-height:1.6;">
        <strong style="font-size:13px;">${meta.icon} ${s.species || 'Sighting'}</strong><br>
        ${s.count ? `Count: <strong>${s.count}</strong><br>` : ''}Spotted ${when || 'just now'} &middot; live
      </div>`);
      m.addTo(map);
      liveSightingMarkers.push(m);
    });
    /*
      The live track's stair-steps are the privacy fuzz showing: positions are
      rounded to a coarse grid before they ever leave the server, so the line
      connects kilometre-spaced grid points with straight segments and reads
      as jagged next to the smooth playback line, which draws exact GPS from
      a finished trip by design.

      The rounding stays exactly as it is; only the drawing changes. Chaikin
      corner-cutting rounds the rendered line through the same coarse points,
      so it looks like a boat's wake instead of a staircase while revealing
      nothing the grid points did not already say. The curve is decoration
      between public points, not position data, and the endpoints are kept so
      the line still meets the boat dot.
    */
    const pts = chaikin((boat.track || []).map(p => [+p.lat, +p.lng]), 3);
    if (pts.length > 1) {
      liveTrackLines.push(L.polyline(pts, {
        color, weight: 2.5, opacity: 0.8, dashArray: '4 6', interactive: false,
      }).addTo(map));
    }
    if (boat.position) {
      const size = 26;
      const marker = L.marker([+boat.position.lat, +boat.position.lng], {
        icon: L.divIcon({
          html: '<div class="live-boat" style="width:' + size + 'px;height:' + size + 'px;">' +
            '<div class="ping" style="border-color:' + color + ';"></div>' +
            '<div class="hull">' + boatSvg(color, 20) + '</div></div>',
          className: '',
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        }),
        zIndexOffset: 1000,
      }).addTo(map);
      marker.bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;line-height:1.6;">
        <strong style="font-size:13px;">⛵ ${boat.boat_name ? boat.boat_name + ' · out' : 'Out'} on the water now</strong><br>
        Approximate position
      </div>`);
      liveBoatMarkers.push(marker);
    }
  });
  // One-shot per broadcast: widen the view so every boat on the water is in
  // frame the first time the live layer appears.
  if (!liveViewFitted && liveBoatMarkers.length) {
    liveViewFitted = true;
    let bounds = map.getBounds();
    let widened = false;
    liveBoatMarkers.forEach(m => {
      const ll = m.getLatLng();
      if (!bounds.contains(ll) && boatNearGrounds(ll)) { bounds = bounds.extend(ll); widened = true; }
    });
    if (widened) {
      map.flyToBounds(bounds, { padding: [40, 40], maxZoom: map.getZoom() });
    }
  }
}

// ── Full-screen map mode ─────────────────────────────────────────────────────
// For an office TV / kiosk: the map takes over the screen and, when a trip is
// broadcasting, the live status floats on top of it. Uses the real Fullscreen
// API where allowed (standalone page; embeds need allowfullscreen on the
// iframe) and falls back to a fixed-position takeover of the viewport.
let mapIsFull = false;
let lastLive = null;

function updateLiveOverlay() {
  const ov = document.getElementById('live-overlay');
  if (!ov) return;
  if (mapIsFull && lastLive) {
    const status = liveStatusText(lastLive);
    document.getElementById('ov-species').textContent = status.species;
    document.getElementById('ov-meta').textContent = status.meta;
    ov.classList.add('on');
  } else {
    ov.classList.remove('on');
  }
}

function pinBounds() {
  const b = L.latLngBounds([]);
  allData.forEach(s => { if (s.lat && s.lng) b.extend([+s.lat, +s.lng]); });
  return b;
}

// True when the live boat is near the operator's sighting grounds. A boat
// far away — captain testing from home, app left running on the drive back —
// still gets its marker, but must never steer the map's framing: auto-fits
// that include it would drag every visitor's view off to the middle of
// nowhere.
function boatNearGrounds(ll) {
  const b = pinBounds();
  if (!b.isValid()) return true; // no pins yet — nothing to protect
  const span = map.distance(b.getNorthWest(), b.getSouthEast());
  return map.distance(b.getCenter(), ll) <= Math.max(span * 2, 60000);
}

// Frame everything the widget knows about — every trip's pins plus each live
// boat and its track (when it's actually out on the grounds). For a bay
// operator this lands on the whole-bay view (Santa Cruz down to Monterey)
// that reads well on a TV.
function fitFullView() {
  if (!map) return;
  const b = pinBounds();
  liveBoatMarkers.forEach(m => {
    if (boatNearGrounds(m.getLatLng())) b.extend(m.getLatLng());
  });
  liveTrackLines.forEach(l => {
    if (boatNearGrounds(l.getBounds().getCenter())) b.extend(l.getBounds());
  });
  if (b.isValid()) map.fitBounds(b, { padding: [60, 60] });
}

function setMapFull(on) {
  const wrap = document.querySelector('.map-wrap');
  if (!wrap || !map) return;
  mapIsFull = on;
  wrap.classList.toggle('is-full', on);
  if (on) {
    if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
  } else if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
  // The ResizeObserver keeps tiles rendering through the size transition;
  // once the container settles, frame the whole picture. Two passes because
  // the browser's full-screen animation can outlast the first.
  if (on) { setTimeout(fitFullView, 350); setTimeout(fitFullView, 1100); }
  else setTimeout(() => map.invalidateSize(), 260);
  updateLiveOverlay();
}

function toggleMapFull() {
  // Embedded in an iframe that doesn't grant fullscreen (no allowfullscreen
  // attribute on the host page): taking over the iframe just letterboxes the
  // map inside the host layout. Break out to the standalone widget in a new
  // tab instead — ?fullmap=1 re-enters full-map mode there on load. Prefer
  // the operator's branded standalone domain (sightings.<operator>.com) over
  // whatever internal URL the iframe happened to load the widget from.
  if (!mapIsFull && window.parent !== window && !document.fullscreenEnabled) {
    const u = new URL(OP.widget_standalone_url || window.location.href);
    if (OP.slug) u.searchParams.set('op', OP.slug);
    u.searchParams.set('fullmap', '1');
    window.open(u.toString(), '_blank');
    return;
  }
  setMapFull(!mapIsFull);
}

// Leaving real fullscreen via Esc/system UI must also unwind the takeover.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && mapIsFull) setMapFull(false);
});
// Esc also exits the fixed-position fallback (no real fullscreen to leave).
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && mapIsFull && !document.fullscreenElement) setMapFull(false);
});

async function pollLive() {
  if (!OP.slug) return;
  try {
    const res = await fetch(`/api/widget-data?op=${encodeURIComponent(OP.slug)}&live=1`, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) return;
    const body = await res.json();
    renderLive(body && body.live);
  } catch (e) { /* offline blip — try again next minute */ }
}

// Format a YYYY-MM-DD trip_date as "06 · MAY · 2026".
function fmtDottedDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d.getTime())) return '—';
  const day = String(d.getDate()).padStart(2, '0');
  const month = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
  return `${day} · ${month} · ${d.getFullYear()}`;
}

// ── Group + species aggregation ───────────────────────────────────────────────
function aggregateBySpecies(data) {
  const map = new Map();
  data.forEach(s => {
    if (!s.species) return;
    const c = parseInt(s.count) || 1;
    const prev = map.get(s.species) || 0;
    map.set(s.species, prev + c);
  });
  return [...map.entries()]
    .map(([name, count]) => ({ name, count, kind: speciesKind(name), meta: sm(name) }))
    .sort((a, b) => b.count - a.count);
}

// How often, not how many. Animal counts are dominated by pod size: one
// 1,000-strong dolphin pod buries forty humpback encounters, so a visitor
// reads "162 whales" and concludes whales are rare, when in truth every
// trip this month saw one. Frequency answers the only question a visitor
// has: if I get on the boat, what will I see?
function aggregateByFrequency(data) {
  const tripsBySpecies = new Map();
  const allTrips = new Set();
  data.forEach(s => {
    const trip = s.trip_id || (s.trip_date || '').slice(0, 10);
    if (!trip) return;
    allTrips.add(trip);
    if (!s.species) return;
    if (!tripsBySpecies.has(s.species)) tripsBySpecies.set(s.species, new Set());
    tripsBySpecies.get(s.species).add(trip);
  });
  const totalTrips = allTrips.size;
  return {
    totalTrips,
    species: [...tripsBySpecies.entries()]
      .map(([name, trips]) => ({
        name,
        trips: trips.size,
        pct: totalTrips ? Math.round((trips.size / totalTrips) * 100) : 0,
        kind: speciesKind(name),
        meta: sm(name),
      }))
      .sort((a, b) => b.trips - a.trips || a.name.localeCompare(b.name)),
  };
}

// Trips (not animals) per group, for the mobile segmented filter.
function tripsByKind(data) {
  const t = { whale: new Set(), dolphin: new Set(), bird: new Set(), other: new Set() };
  data.forEach(s => {
    const trip = s.trip_id || (s.trip_date || '').slice(0, 10);
    if (!trip || !s.species) return;
    t[speciesKind(s.species)].add(trip);
  });
  return { whale: t.whale.size, dolphin: t.dolphin.size, bird: t.bird.size, other: t.other.size };
}

function totalsByKind(species) {
  const t = { whale: 0, dolphin: 0, bird: 0, other: 0 };
  species.forEach(s => { t[s.kind] += s.count; });
  return t;
}

// Renders a small colored dot. Split species (orcas) get a half-and-half
// dot so the legend reads as a true map legend.
function legendDotHTML(spec, extraClass = '') {
  if (!spec) return `<span class="legend-dot is-all ${extraClass}"></span>`;
  if (spec.meta && spec.meta.isSplit) return `<span class="legend-dot is-split ${extraClass}"></span>`;
  return `<span class="legend-dot ${extraClass}" style="background:${spec.meta.color};"></span>`;
}

// ── Desktop · D — legend column ──────────────────────────────────────────────
function renderLegend(data) {
  const list = document.getElementById('legend-list');
  if (!list) return;
  const { totalTrips, species } = aggregateByFrequency(data);

  // The window these odds describe. Same honesty rule as the counts this
  // replaced: name the range, and only call it the season once Show earlier
  // trips has actually pulled the season in.
  const head = document.getElementById('legend-head');
  if (head) {
    const dates = data.map(x => (x.trip_date || '').slice(0, 10)).filter(Boolean).sort();
    const since = dates.length
      ? fmtDateShort(dates[0]).replace(`, ${new Date().getFullYear()}`, '')
      : '';
    head.textContent = dates.length
      ? (feedNextBefore ? `What you'll see \u00b7 since ${since}` : `What you'll see \u00b7 the season, since ${since}`)
      : "What you'll see";
  }

  const rows = [];
  rows.push(`
    <button class="legend-row" type="button" data-species="all">
      <span class="legend-dot is-all"></span>
      <span class="legend-name">All species</span>
      <span class="legend-count">${totalTrips} trip${totalTrips === 1 ? '' : 's'}</span>
    </button>`);
  // Birds sit out of the odds panel. This answers "what marine wildlife will
  // I see on a whale watch", and a seabird logged in some seasons and not
  // others reads as rare when it is really just unevenly recorded. Their
  // records are untouched: still on the map, in the trip cards, and behind
  // the Birds filter.
  species.filter(spec => spec.kind !== 'bird').forEach(spec => {
    // The bar is the argument: a species seen on every trip fills its row.
    rows.push(`
      <button class="legend-row" type="button" data-species="${spec.name.replace(/"/g, '&quot;')}">
        <span class="legend-bar" style="width:${spec.pct}%; background:${spec.meta.color};"></span>
        ${legendDotHTML(spec)}
        <span class="legend-name" title="${spec.name.replace(/"/g, '&quot;')}">${spec.name}</span>
        <span class="legend-freq">${spec.trips} of ${totalTrips}</span>
        <span class="legend-count">${spec.pct}%</span>
      </button>`);
  });
  list.innerHTML = rows.join('');

  list.querySelectorAll('.legend-row').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.species;
      const next = val === 'all' ? null : (activeFilter === val ? null : val);
      setActiveFilter(next);
    });
  });

  syncFilterUI();
}

// ── Mobile · C — segmented group + horizontal species rail ──────────────────
function renderSegmentedRail(data) {
  // Counts here are TRIPS the group appeared on, not animals seen, for the
  // same reason the legend changed: pod size otherwise drowns out whales.
  const totals = tripsByKind(data);
  const total = new Set(data.map(x => x.trip_id || (x.trip_date || '').slice(0, 10)).filter(Boolean)).size;

  const segs = [
    { id: 'all',     label: 'All',      count: total },
    { id: 'whale',   label: 'Whales',   count: totals.whale },
    { id: 'dolphin', label: 'Dolphins', count: totals.dolphin },
    { id: 'bird',    label: 'Birds',    count: totals.bird },
    { id: 'other',   label: 'Other',    count: totals.other },
  ].filter(g => g.id === 'all' || g.count > 0);

  const seg = document.getElementById('seg-group');
  if (seg) {
    seg.innerHTML = segs.map(g => `
      <button class="seg-btn" type="button" data-kind="${g.id}">
        <span>${g.label}</span>
        <span class="seg-btn-count">${g.count}</span>
      </button>`).join('');
    seg.querySelectorAll('.seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeKind = btn.dataset.kind;
        // Switching groups clears the species pin so the rail starts at "All"
        setActiveFilter(null);
      });
    });
  }

  renderRailForKind(aggregateByFrequency(data).species);
}

function renderRailForKind(speciesPrecomputed) {
  const rail = document.getElementById('species-rail');
  if (!rail) return;
  const all = speciesPrecomputed || aggregateByFrequency(allData).species;
  const visible = activeKind === 'all' ? all : all.filter(s => s.kind === activeKind);

  const pills = [];
  pills.push(`
    <button class="rail-pill" type="button" data-species="all">All</button>`);
  visible.forEach(spec => {
    pills.push(`
      <button class="rail-pill" type="button" data-species="${spec.name.replace(/"/g, '&quot;')}">
        ${legendDotHTML(spec)}
        ${spec.name}
        <span class="rail-pill-count">${spec.pct}%</span>
      </button>`);
  });
  rail.innerHTML = pills.join('');

  rail.querySelectorAll('.rail-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.species;
      const next = val === 'all' ? null : (activeFilter === val ? null : val);
      setActiveFilter(next);
    });
  });

  syncFilterUI();
}

// Updates the active visual state on the legend rows, segmented group, and
// rail pills — called whenever activeFilter or activeKind changes. Keeps
// every filter surface in sync so user mental model never breaks.
function syncFilterUI() {
  // Legend rows
  document.querySelectorAll('#legend-list .legend-row').forEach(row => {
    const sp = row.dataset.species;
    const isAll = sp === 'all';
    const isActive = (activeFilter === null && isAll) || sp === activeFilter;
    const isDimmed = activeFilter !== null && !isActive;
    row.classList.toggle('is-active', isActive);
    row.classList.toggle('is-dimmed', isDimmed);
  });

  // Segmented group
  document.querySelectorAll('#seg-group .seg-btn').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.kind === activeKind);
  });

  // Rail pills
  document.querySelectorAll('#species-rail .rail-pill').forEach(btn => {
    const sp = btn.dataset.species;
    const isAll = sp === 'all';
    const isActive = (activeFilter === null && isAll) || sp === activeFilter;
    btn.classList.toggle('is-active', isActive);
  });

  // Legend italic status line
  const status = document.getElementById('legend-status');
  if (status) {
    const totalPins = allData.filter(s => s.lat && s.lng).length;
    if (activeFilter) {
      const n = allData.filter(s => s.species === activeFilter && s.lat && s.lng).length;
      status.textContent = `Highlighting ${n} ${activeFilter} pin${n === 1 ? '' : 's'}.`;
    } else {
      status.textContent = `Showing all ${totalPins} pin${totalPins === 1 ? '' : 's'}.`;
    }
  }
}

// Central click handler — sets the species filter (or clears it), then
// re-syncs every surface that reflects it (map opacity, legend rows,
// rail pills, trip-log filter).
function setActiveFilter(speciesOrNull) {
  // Any filter tap cancels a running replay so the animation doesn't keep
  // playing underneath the filtered pins.
  stopReplay();
  activeFilter = speciesOrNull;
  // Selecting a species also clears any active trip-date selection so the
  // user is never looking at two filters at once.
  activeTripKey = null;
  document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
  // If a species got selected from outside the current segmented group,
  // jump to its group so the rail keeps the pill in view.
  if (speciesOrNull) {
    const kind = speciesKind(speciesOrNull);
    if (activeKind !== 'all' && activeKind !== kind) {
      activeKind = kind;
      renderRailForKind();
    }
  } else {
    renderRailForKind();
  }
  refreshMarkers();
  applyFeedFilter();
  syncFilterUI();
}

function applyFeedFilter() {
  document.querySelectorAll('.trip-card').forEach(card => {
    if (!activeFilter) { card.classList.remove('hidden'); return; }
    const hasSpecies = card.querySelector(`.sighting-row[data-species="${activeFilter}"]`);
    card.classList.toggle('hidden', !hasSpecies);
  });
  const visible = document.querySelectorAll('.trip-card:not(.hidden)').length;
  document.getElementById('feed-count').textContent = `${visible} trip${visible !== 1 ? 's' : ''}`;
  sendHeight();
}

// ── Feed ──────────────────────────────────────────────────────────────────────
function renderFeed(data) {
  const list = document.getElementById('feed-list');
  const trips = groupByTrip(data);
  document.getElementById('feed-count').textContent = `${trips.length} trip${trips.length !== 1 ? 's' : ''}`;
  if (!trips.length) { list.innerHTML = '<div class="state-msg">No sightings recorded yet.</div>'; return; }

  // Every card title leads with its scheduled departure ("9:00 AM"), not the
  // daypart ("Morning") — "9:00 AM" and "10:00 AM" tell two trips apart on a
  // busy day, and a single trip reads more precisely too, for every operator.
  // The daypart is only ever a fallback, for the rare trip with no stamped
  // departure (pre-roster history, or a trip logged with no time picked).
  // Boat name stays reserved for days with more than one trip: on a
  // single-trip day it is the only boat, so naming it again is just noise.
  const tripsPerDate = {};
  trips.forEach(([, sightings]) => {
    const d = (sightings[0].trip_date || '').slice(0, 10);
    tripsPerDate[d] = (tripsPerDate[d] || 0) + 1;
  });

  list.innerHTML = trips.map(([tripKey, sightings]) => {
    const tripDate = (sightings[0].trip_date || '').slice(0, 10);
    const tripPart = sightings[0].trip_part || '';
    const meta = tripMetaByTrip.get(tripKey) || {};
    const boatName = tripsPerDate[tripDate] > 1 ? (meta.boat_name || '') : '';
    const timeLabel = fmtDepartureTime(meta.trip_time) || tripPart;
    const totalAnimals = sightings.reduce((sum, s) => sum + (parseInt(s.count) || 1), 0);
    const tallied = tallyBySpecies(sightings);
    const rows = tallied.map(([species, d]) => {
      const meta = sm(species);
      const hasGps = !!(d.lat && d.lng);
      return `<div class="sighting-row" data-trip="${tripKey}" data-species="${species}" data-has-gps="${hasGps}">
        <div class="species-icon">${meta.icon}</div>
        <div class="species-name">${species}</div>
        <div class="species-count">×${d.count}</div>
      </div>`;
    }).join('');

    const audio = tripAudioByTrip.get(tripKey);
    const audioBlock = audio ? renderAudioPlayer(audio) : '';

    // Photo gallery: the hero is a swipeable mini carousel (cover-cropped); a
    // count badge shows the total, and tapping any photo opens the viewer.
    // Only renders when the trip has photos; otherwise the species list keeps
    // its original full-width layout untouched.
    const photos = tripPhotosByTrip.get(tripKey) || [];
    const photoBlock = photos.length
      ? `<div class="trip-gallery" data-gallery-trip="${tripKey}" role="button" tabindex="0" aria-label="View ${photos.length} photo${photos.length === 1 ? '' : 's'} from this trip">
            <div class="hero-track">
              ${photos.map((p, i) => `<img src="${thumbUrl(p.photo_url, 900).replace('&resize=cover', '')}" data-idx="${i}" alt="Trip photo" loading="lazy"${i === 0 ? ' onload="sendHeight()"' : ''}>`).join('')}
            </div>
            ${photos.length > 1 ? `<span class="gallery-count"><svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>${photos.length}</span>` : ''}
          </div>`
      : '';

    // Replayable when there is a line for the boat to follow. That is either
    // a real GPS breadcrumb, whatever the sighting count, or two placed
    // sightings for the fallback harbor -> sightings -> harbor path.
    //
    // These two conditions must stay in step with the guard at the top of
    // replayTrip(). They were not: this one asked only about sightings, so
    // Princess's 2026-08-07 evening trip, one humpback on a full 500 point
    // route, rendered no play button at all even after replayTrip() was
    // taught to accept it. Fixing the function without the button just moved
    // where the trip was refused.
    const tripTrack = tripTrackById.get(tripKey);
    const hasTrackForReplay = Array.isArray(tripTrack) && tripTrack.length >= 2;
    const replayable = sightings.filter(s => s.lat && s.lng && s.sighting_time).length;
    const replayBtn = (hasTrackForReplay || replayable >= 2)
      ? `<button class="trip-replay-btn" type="button" aria-label="Replay this trip" data-replay-trip="${tripKey}">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>`
      : '';

    return `<div class="trip-card" data-trip="${tripKey}">
      <div class="trip-date-header" data-trip="${tripKey}">
        <div class="trip-date-label">
          <span class="active-indicator"></span>
          ${fmtDate(tripDate)}${timeLabel ? ' · ' + timeLabel : ''}${boatName ? ' · ' + boatName : ''}
        </div>
        <div class="trip-date-right">
          <div class="trip-summary">${tallied.length} species &middot; ${totalAnimals} animals</div>
          ${replayBtn}
          <button class="trip-share-btn" type="button" aria-label="Share this trip" data-share-trip="${tripKey}">
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
      </div>
