      ${audioBlock}
      ${photoBlock
        ? `<div class="trip-body">${photoBlock}<div class="trip-sightings">${rows}</div></div>`
        : `<div class="trip-sightings">${rows}</div>`}
    </div>`;
  }).join('');

  // Share button on each trip card — opens the iOS / Android / desktop
  // native share sheet via Web Share API (Safari, Chrome, Edge). Firefox
  // falls back to clipboard + a small toast. stopPropagation so the
  // share click doesn't also toggle the trip-header selection.
  list.querySelectorAll('.trip-share-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      shareTrip(btn.dataset.shareTrip);
    });
  });

  // Replay button on each trip card — animates a polyline pin-by-pin in the
  // order the captain logged the sightings.
  list.querySelectorAll('.trip-replay-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      replayTrip(btn.dataset.replayTrip);
    });
  });

  // Trip header click — show only that trip's pins
  list.querySelectorAll('.trip-date-header').forEach(header => {
    header.addEventListener('click', () => {
      const tripKey = header.dataset.trip;
      if (activeTripKey === tripKey) {
        // Deselect
        activeTripKey = null;
        header.classList.remove('active-trip');
        document.querySelectorAll('.trip-card').forEach(c => c.classList.remove('selected', 'hidden'));
      } else {
        activeTripKey = tripKey;
        document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
        document.querySelectorAll('.trip-card').forEach(c => { c.classList.remove('selected'); c.classList.remove('hidden'); });
        header.classList.add('active-trip');
        header.closest('.trip-card').classList.add('selected');
        // Pan map to this trip's center (only when the map is rendered)
        if (map) {
          const dm = allData.filter(s => s.trip_id === tripKey && s.lat && s.lng);
          if (dm.length) {
            const lats = dm.map(s => +s.lat), lngs = dm.map(s => +s.lng);
            map.panTo([(Math.min(...lats)+Math.max(...lats))/2, (Math.min(...lngs)+Math.max(...lngs))/2], { animate: true });
          }
        }
      }
      refreshMarkers();
    });
  });

  // Sighting row click — zoom to specific marker
  list.querySelectorAll('.sighting-row').forEach(row => {
    row.addEventListener('click', () => {
      if (row.dataset.hasGps !== 'true') return;
      list.querySelectorAll('.sighting-row').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      // Set active trip and refresh
      activeTripKey = row.dataset.trip;
      document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
      const header = list.querySelector(`.trip-date-header[data-trip="${row.dataset.trip}"]`);
      if (header) header.classList.add('active-trip');
      refreshMarkers();
      // Pan to this specific marker (no-op when the map is hidden)
      if (map) {
        const m = markers.find(x => x._tripKey === row.dataset.trip && x._species === row.dataset.species);
        if (m) { map.panTo(m.getLatLng(), { animate: true }); setTimeout(() => m.openPopup(), 300); }
      }
    });
  });

  // Wire up the custom audio players that just got painted into trip cards
  bindAudioPlayers(list);
  bindTripGalleries(list);

  sendHeight();
}

function sendHeight() {
  // While the full-screen photo viewer is open the host has sized the iframe to
  // the screen. Don't post our (tall) content height or the host would resize
  // the iframe back, pushing the contained photo off-screen.
  if (document.querySelector('.gv-fullscreen')) return;
  window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
}

// Bring the map to the top of the viewport when a replay starts. The embed is
// an auto-sized iframe, so the HOST page scrolls, not us — ask the parent to
// scroll the iframe into view (the embed snippet listens for this message).
// When opened standalone (not embedded), scroll our own document instead.
function scrollMapIntoView() {
  try { window.parent.postMessage({ widgetScrollIntoView: true }, '*'); } catch (e) {}
  if (window.parent === window) {
    const el = document.querySelector('.map-wrap') || document.getElementById('sightings-map');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ── Share ─────────────────────────────────────────────────────────────
// Visitor on the embed taps the share icon on a trip card → iOS / Android
// native share sheet opens with a deep-link to the same widget filtered
// to that trip. Recipient opens the link, lands on the widget already
// pointed at that trip with the audio one tap away. Each share is a free
// referral for the operator.

function shareUrlForTrip(tripKey) {
  // Prefer the operator's own widget page (configured per-operator as
  // widget_host_url) so the share recipient lands on their branded site
  // with their nav + Book Now + SEO, not the bare vercel widget URL.
  // Falls back to /api/sightings on our domain when widget_host_url is
  // unset (any new operator pre-config or an operator with no public
  // page yet).
  var hostUrl = OP && OP.widget_host_url;
  if (hostUrl) {
    var sep = hostUrl.indexOf('?') === -1 ? '?' : '&';
    return hostUrl + sep + 'trip=' + encodeURIComponent(tripKey);
  }
  var slug = (OP && OP.slug) || 'enocean';
  return location.origin + '/api/sightings?op=' + encodeURIComponent(slug) +
                           '&trip=' + encodeURIComponent(tripKey);
}

function buildShareText(tripKey) {
  var tally = tallyBySpecies(allData.filter(s => s.trip_id === tripKey));
  if (!tally.length) return '';
  var topSpecies = tally.slice(0, 3).map(t => t[0]).join(', ');
  var extra = tally.length > 3 ? ' and more' : '';
  return tally.length + ' species seen — ' + topSpecies + extra +
         '. Listen to the captain\\u2019s notes from this trip.';
}

async function shareTrip(tripKey) {
  var url = shareUrlForTrip(tripKey);
  var sel = allData.find(s => s.trip_id === tripKey) || {};
  var title = 'Sightings · ' + fmtDate((sel.trip_date || '').slice(0, 10)) +
              (sel.trip_part ? ' ' + sel.trip_part : '');
  var text  = buildShareText(tripKey);

  if (navigator.share) {
    try {
      await navigator.share({ title: title, text: text, url: url });
    } catch (err) {
      // User cancelled the share sheet — silent. Other errors fall
      // through to the clipboard path so the link isn't lost.
      if (err && err.name === 'AbortError') return;
      copyShareUrl(url);
    }
    return;
  }
  copyShareUrl(url);
}

function copyShareUrl(url) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(
      () => showShareToast('Link copied'),
      () => showShareToast('Press ⌘/Ctrl + C to copy: ' + url),
    );
  } else {
    showShareToast(url);
  }
}

var _shareToastTimer = null;
function showShareToast(message) {
  var existing = document.getElementById('share-toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.id = 'share-toast';
  t.className = 'share-toast';
  t.textContent = message;
  document.body.appendChild(t);
  // Force a reflow so the .show transition actually fires
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(_shareToastTimer);
  _shareToastTimer = setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 220);
  }, 2200);
}

// ── Replay ─────────────────────────────────────────────────────────────
// Visitor taps ▶ on a trip card → the map zooms to that trip and a teal
// polyline draws from the harbor, out across the bay, and back. Existing
// pins start hidden and pop in as the line reaches each one. A little boat
// rides the head of the line and PAUSES on each sighting for a beat before
// carrying on to the next.
//
// Phase 2: when a real GPS breadcrumb exists for the trip (tripTrackById),
// the boat follows the actual recorded path and reveals each sighting when
// it passes within proximity of the pin. For older trips with no recorded
// track (pre-Phase 2), it falls back to straight pin-to-pin lines from
// harbor → sightings → harbor.
//
// Pacing: track-based replay uses a fixed total duration regardless of how
// many points were recorded, so a 4-hour trip with thousands of breadcrumbs
// doesn't take minutes to play back. The older sighting-to-sighting path
// uses constant-ish speed (segment time ∝ leg distance, clamped).
const BOAT_SPEED_M_PER_MS = 3.2;      // map-metres per ms (pin-to-pin fallback)
const TRAVEL_MIN_MS = 650, TRAVEL_MAX_MS = 3400;  // per-leg clamps (fallback)
const TRACK_REPLAY_TOTAL_MS = 10000;  // total travel time when following the real track
const PIN_PAUSE_MS = 500;             // hold on each sighting before moving on
// Each ▶ click bumps _replayToken; an in-flight replay sees the number change
// and bails out of its animation loops, so a new replay cleanly supersedes the
// running one. _replayLine/_replayBoat are module-level so the new run can clear
// whatever the previous one left on the map the instant it starts.
let _replayToken = 0;
let _replayLine = null;
let _replayBoat = null;
let _boatPrev = null;                 // last boat position, for heading

async function replayTrip(tripKey, opts) {
  const silent = opts && opts.silent;
  if (!map) return;
  const ordered = allData
    .filter(s => s.trip_id === tripKey && s.lat && s.lng && s.sighting_time)
    .sort((a, b) => String(a.sighting_time).localeCompare(String(b.sighting_time)));
  // What the replay actually follows is the GPS breadcrumb, when there is
  // one; the sightings only decide when pins pop in along it. So the gate is
  // on the path, not on the sighting count. Gating on sightings meant a trip
  // with a full 500 point route and a single whale refused to replay and
  // said "not enough sightings", which is how Princess's 2026-08-07 evening
  // trip looked: one humpback, complete track, no playback. Only the
  // fallback path (harbor -> sightings -> harbor) genuinely needs two
  // sightings, because there it IS the line.
  const preTrack = tripTrackById.get(tripKey);
  const hasTrack = Array.isArray(preTrack) && preTrack.length >= 2;
  if (!hasTrack && ordered.length < 2) {
    if (!silent) showShareToast('Not enough of this trip was recorded to replay');
    return;
  }

  // Supersede any in-flight replay: bump the token (its animation loops check
  // this and bail) and clear whatever it left on the map, then start fresh.
  const token = ++_replayToken;
  clearReplay();
  // On a real tap (not the silent auto-play), bring the map into view — on a
  // phone the trip list scrolls far below the map, so otherwise you'd watch
  // the replay off-screen. Embedded, this asks the host page to scroll up.
  if (!silent) scrollMapIntoView();

  try {
    // Focus this trip and sync the card UI to the new selection (same
    // visual state as a header click).
    activeTripKey = tripKey;
    refreshMarkers();
    document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
    document.querySelectorAll('.trip-card').forEach(c => { c.classList.remove('selected'); c.classList.remove('hidden'); });
    const header = document.querySelector('.trip-date-header[data-trip="' + tripKey + '"]');
    if (header) { header.classList.add('active-trip'); header.closest('.trip-card').classList.add('selected'); }

    // Hide this trip's pins so they reveal in sequence.
    const tripMarkers = markers.filter(m => m._tripKey === tripKey);
    tripMarkers.forEach(m => setMarkerOpacity(m, 0));

    // Prefer the real GPS breadcrumb (Phase 2) so the boat follows the actual
    // route the captain took. Older trips with no recorded track fall back to
    // the straight harbor → sightings → harbor path.
    const homePort = (OP && OP.home_port) || null;
    const track = preTrack;
    const useTrack = hasTrack;

    let anchors;           // [ [lat,lng], … ] — the line the boat follows
    let revealAtIdx;       // Map(anchorIndex -> [sighting, …]) — pin pop-ins
    let useFixedTiming;    // true when the path is dense (track) so legs are short

    if (useTrack) {
      anchors = track.map(p => [+p.lat, +p.lng]);
      if (homePort) {
        anchors = [[homePort.lat, homePort.lng], ...anchors, [homePort.lat, homePort.lng]];
      }
      // Reveal each sighting when the boat reaches the breadcrumb point
      // nearest to it (spatial match — doesn't care about clock differences
      // between phone and server).
      revealAtIdx = new Map();
      for (const s of ordered) {
        let bestIdx = 0, bestDist = Infinity;
        for (let i = 0; i < anchors.length; i++) {
          const d = map.distance(anchors[i], [+s.lat, +s.lng]);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        if (!revealAtIdx.has(bestIdx)) revealAtIdx.set(bestIdx, []);
        revealAtIdx.get(bestIdx).push(s);
      }
      useFixedTiming = true;
    } else {
      // Fallback: home → each sighting in order → home. One anchor per stop.
      const startsAtHome = !!homePort;
      anchors = [];
      if (homePort) anchors.push([homePort.lat, homePort.lng]);
      ordered.forEach(s => anchors.push([+s.lat, +s.lng]));
      if (homePort) anchors.push([homePort.lat, homePort.lng]);
      revealAtIdx = new Map();
      const sightingBase = startsAtHome ? 1 : 0;
      ordered.forEach((s, k) => revealAtIdx.set(sightingBase + k, [s]));
      useFixedTiming = false;
    }

    // Frame the whole path and let the pan/zoom settle.
    map.fitBounds(L.latLngBounds(anchors), { padding: [40, 40], maxZoom: 13, animate: true });
    await wait(350);
    if (token !== _replayToken) return;  // superseded during the pan/zoom settle

    const line = _replayLine = L.polyline([], {
      color: '#0fbfb1', weight: 3, opacity: 0.9, lineCap: 'round', lineJoin: 'round',
    }).addTo(map);

    // The little boat that rides the head of the line.
    const boat = _replayBoat = L.marker(anchors[0], { icon: makeBoatIcon(), interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map);
    _boatPrev = null;
    moveBoat(boat, anchors[0][0], anchors[0][1]);

    line.addLatLng(anchors[0]);
    // Reveal anything pinned to the starting anchor (only happens in the
    // fallback path when there's no home port).
    (revealAtIdx.get(0) || []).forEach(s => revealMarkerAt(tripMarkers, s));

    const fixedLegMs = TRACK_REPLAY_TOTAL_MS / Math.max(anchors.length - 1, 1);

    for (let i = 1; i < anchors.length; i++) {
      if (token !== _replayToken) return;  // a newer replay took over
      const from = anchors[i - 1];
      const to   = anchors[i];
      let travelMs;
      if (useFixedTiming) {
        travelMs = fixedLegMs;
      } else {
        // Constant-ish speed for the fallback: leg time ∝ leg distance.
        const meters = map.distance(from, to);
        travelMs = Math.max(TRAVEL_MIN_MS, Math.min(TRAVEL_MAX_MS, meters / BOAT_SPEED_M_PER_MS));
      }
      line.addLatLng(from);
      await animatePolylineHead(line, from, to, travelMs, boat, token);
      if (token !== _replayToken) return;
      const reveals = revealAtIdx.get(i);
      if (reveals && reveals.length) {
        reveals.forEach(s => revealMarkerAt(tripMarkers, s));
        await wait(PIN_PAUSE_MS);
      }
    }
    // Linger so the finished path stays visible for a beat, then clear.
    await wait(1200);
  } finally {
    // Only tear down if we're still the active run; a superseding replay has
    // already cleared us and now owns the globals.
    if (token === _replayToken) clearReplay();
  }
}

// Remove the current replay's line + boat from the map and forget them.
function clearReplay() {
  if (_replayLine) { _replayLine.remove(); _replayLine = null; }
  if (_replayBoat) { _replayBoat.remove(); _replayBoat = null; }
}

// Cancel any in-flight replay — bump the token so its animation loops bail, and
// clear its line + boat now. Called when the visitor taps a filter so the
// playback stops instead of running on underneath the pins.
function stopReplay() {
  _replayToken++;
  clearReplay();
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2) / 2; }

function animatePolylineHead(line, from, to, ms, boat, token) {
  return new Promise(resolve => {
    const start = performance.now();
    function frame(now) {
      if (token !== _replayToken) { resolve(); return; }  // superseded → stop touching the line
      const t = Math.min(1, (now - start) / ms);
      // Linear so the boat holds a steady speed along the leg (the constant
      // pace comes from leg time ∝ distance, set by the caller).
      const lat = from[0] + (to[0] - from[0]) * t;
      const lng = from[1] + (to[1] - from[1]) * t;
      const pts = line.getLatLngs();
      pts[pts.length - 1] = L.latLng(lat, lng);
      line.setLatLngs(pts);
      if (boat) moveBoat(boat, lat, lng);
      if (t < 1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}

// ── Replay boat ────────────────────────────────────────────────────────
// A small top-down boat (bow points "up" at 0°). It's a divIcon so we can
// rotate an inner element to the heading without fighting Leaflet's own
// position transform on the outer element.
// The hull itself, so the live boat and the replay boat are the same shape
// rather than two different ideas of "boat" on one map. Only the fill
// changes: replay is the fixed teal, live takes the boat's roster colour.
function boatSvg(fill, size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 2 C7 9 7 15 8 20 C8 21 16 21 16 20 C17 15 17 9 12 2 Z" ' +
        'fill="' + fill + '" stroke="#053b37" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<circle cx="12" cy="13" r="1.7" fill="#053b37"/>' +
    '</svg>';
}

function makeBoatIcon() {
  const svg = boatSvg('#0fbfb1', 22);
  return L.divIcon({
    className: 'replay-boat',
    html: '<div class="replay-boat-inner" style="line-height:0;transform-origin:50% 50%;transition:transform .12s linear;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));">' + svg + '</div>',
    iconSize: [22, 22],
    iconAnchor: [11, 11],
  });
}

// Move the boat to (lat,lng) and point its bow along the direction of travel.
// Heading is computed from the previous position; tiny moves keep the prior
// heading so the boat doesn't jitter when nearly still.
function moveBoat(boat, lat, lng) {
  if (_boatPrev) {
    const dLat = lat - _boatPrev[0];
    const dLng = (lng - _boatPrev[1]) * Math.cos(lat * Math.PI / 180);
    if (Math.abs(dLat) > 1e-9 || Math.abs(dLng) > 1e-9) {
      const deg = Math.atan2(dLng, dLat) * 180 / Math.PI;  // 0° = north (bow up)
      const el = boat.getElement && boat.getElement();
      const inner = el && el.querySelector('.replay-boat-inner');
      if (inner) inner.style.transform = 'rotate(' + deg + 'deg)';
    }
  }
  boat.setLatLng([lat, lng]);
  _boatPrev = [lat, lng];
}

// Leaflet's L.Marker uses setOpacity; L.CircleMarker / Path use setStyle.
// One helper that handles both keeps the replay code marker-type-agnostic.
function setMarkerOpacity(marker, v) {
  if (marker.setStyle) marker.setStyle({ opacity: v, fillOpacity: v * 0.95 });
  else if (marker.setOpacity) marker.setOpacity(v);
}

function revealMarkerAt(tripMarkers, s) {
  const lat = +s.lat, lng = +s.lng;
  const target = tripMarkers.find(m => {
    const ml = m.getLatLng();
    return Math.abs(ml.lat - lat) < 1e-6 && Math.abs(ml.lng - lng) < 1e-6;
  });
  if (!target) return;
  const start = performance.now();
  const ms = 220;
  function frame(now) {
    const t = Math.min(1, (now - start) / ms);
    setMarkerOpacity(target, t);
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ── Deep-link ─────────────────────────────────────────────────────────
// When the widget is opened with ?trip=<trip id> (shared link), we seed
// activeTripKey from the URL on init so the right trip is pre-selected
// and its pins are the only ones on the map. Called after renderFeed
// paints the trip cards (the click-handlers exist by then).
function applyInitialTripFromUrl() {
  try {
    var params = new URLSearchParams(window.location.search);
    var trip = params.get('trip');
    if (!trip) return;
    // Only honor it if we actually have data for that trip — otherwise
    // a stale link from before a re-sync would orphan the user on an
    // empty view.
    var hasIt = allData.some(s => s.trip_id === trip);
    if (!hasIt) return;
    activeTripKey = trip;
    var header = document.querySelector('.trip-date-header[data-trip="' + trip + '"]');
    if (header) {
      document.querySelectorAll('.trip-date-header').forEach(h => h.classList.remove('active-trip'));
      header.classList.add('active-trip');
      header.closest('.trip-card').classList.add('selected');
      // Scroll the shared trip into view so the visitor sees it without
      // hunting. block:'start' keeps the trip header just below the map.
      header.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    refreshMarkers();
    // Pan map to this trip's center (only when the map is rendered)
    if (map) {
      var pins = allData.filter(s => s.trip_id === trip && s.lat && s.lng);
      if (pins.length) {
        var lats = pins.map(s => +s.lat), lngs = pins.map(s => +s.lng);
        map.panTo([(Math.min(...lats)+Math.max(...lats))/2, (Math.min(...lngs)+Math.max(...lngs))/2], { animate: true });
      }
    }
  } catch (e) { /* malformed URL params — ignore */ }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  // Guard against unresolved operators (typo in the ?op= slug, or no operators
  // table row matching). Without this, the queries below would filter on
  // operator_id=eq.null, which PostgREST evaluates to "match nothing" — still
  // safer than the old unfiltered query, but the captain deserves a clearer
  // signal than "No data yet" when their slug is wrong.
  if (!OPERATOR_ID) {
    document.getElementById('feed-list').innerHTML = `<div class="state-msg">Operator not found.<br><small style="color:#555">Check the <code>?op=&lt;slug&gt;</code> in the embed URL.</small></div>`;
    document.getElementById('status-text').textContent = 'No operator';
    sendHeight();
    return;
  }
  try {
    [allData, tripAudioByTrip, tripTrackById, tripPhotosByTrip, tripMetaByTrip] = await Promise.all([
      fetchSightings(), fetchTripAudio(), fetchTripTracks(), fetchTripPhotos(), fetchTripMeta()
    ]);
    // Arm paging before the first paint: renderLegend words its scope line
    // differently depending on whether more season is still out there, and
    // loadWidgetData is memoized so this costs nothing.
    const first = await loadWidgetData();
    feedNextBefore = first && first.has_more ? first.next_before : null;
    setFeedMoreVisible(!!feedNextBefore);
    renderNowBanner(allData);
    renderLegend(allData);
    renderSegmentedRail(allData);
    refreshMarkers();
    renderFeed(allData);
    // Live layer: paint from the feed we already have, then keep it fresh.
    const wd = await loadWidgetData();
    const liveNow = !!(wd && wd.live && wd.live.active);
    renderLive(wd && wd.live);
    setInterval(pollLive, LIVE_POLL_MS);
    document.getElementById('status-text').textContent =
      allData.length ? fmtDottedDate(allData[0].trip_date) : 'No data yet';
    // If the URL has ?trip=<trip id> (shared link), seed the selection
    // AFTER renderFeed has painted the trip cards — its click handlers
    // are wired by then, the .trip-date-header element exists, and we
    // can scroll to it cleanly.
    applyInitialTripFromUrl();

    // No shared-link trip in the URL? Default to the newest trip so the
    // map opens focused on one trip instead of every pin ever — the full
    // feed is still scrollable for visitors who want older trips. Skipped
    // while a trip is broadcasting: the live boat + live dots own the map,
    // and yesterday's pins next to them read as a second boat.
    if (!activeTripKey && allData.length && !liveNow) {
      const newest = groupByTrip(allData)[0];
      if (newest) {
        activeTripKey = autoSelectedTripKey = newest[0];
        const header = document.querySelector('.trip-date-header[data-trip="' + activeTripKey + '"]');
        if (header) {
          header.classList.add('active-trip');
          header.closest('.trip-card').classList.add('selected');
        }
        refreshMarkers();
      }
    }

    // Auto-play the replay animation for whichever trip ended up selected
    // — shared-link visitors see the shared trip play, first-time visitors
    // see the most recent trip. Silent so a trip too small to replay just
    // sits there instead of toasting on page load. Skipped while a trip is
    // broadcasting: a replaying past track next to the live boat reads as
    // two boats out at once.
    if (activeTripKey && !liveNow) {
      replayTrip(activeTripKey, { silent: true }).catch(() => {});
    }

    // Arrived via the embed's full-screen breakout (?fullmap=1): enter the
    // full-map takeover immediately. True browser fullscreen still needs a
    // user gesture — the expand button is right there for that.
    if (map && new URLSearchParams(window.location.search).get('fullmap')) {
      setMapFull(true);
    }

    sendHeight();
  } catch (err) {
    document.getElementById('feed-list').innerHTML = `<div class="state-msg">Could not load sightings.<br><small style="color:#555">${err.message}</small></div>`;
    document.getElementById('status-text').textContent = 'Data unavailable';
    sendHeight();
  }
})();

window.addEventListener('load', sendHeight);
new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
